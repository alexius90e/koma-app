<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOMA APP</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/index.css" />
    <script type="module" src="./js/index.js" defer></script>
  </head>

  <body>
    <main class="main">
      <section class="connect">
        <div class="container">
          <div class="connect__wrapper">
            <figure class="connect__bg">
              <img class="connect__bg-image" src="./assets/koma-connect.jpg" alt="bg" />
            </figure>

            <div class="connect__content">
              <h3 class="connect__title">Connect you wallet</h3>
              <div class="connect__description">
                Before using all the features of the community, you must connect your X
              </div>
              <div class="connect__buttons">
                <button class="button">Connect wallet</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
