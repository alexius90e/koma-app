<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOMA APP</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/index.css" />
    <script type="module" src="./js/index.js" defer></script>
  </head>

  <body>
    <main class="main">
      <section class="install">
        <div class="container">
          <div class="install__wrapper">
            <figure class="install__logo">
              <img class="install__logo-image" src="./assets/logo-full.svg" alt="logo" />
            </figure>

            <div class="install__brief">
              <div class="install__brief-header">
                <figure class="install__brief-header-logo">
                  <img
                    class="install__brief-header-logo-image"
                    src="./assets/logo.svg"
                    alt="logo"
                  />
                </figure>
                <div class="install__brief-header-text">Install Koma Mobile to continue</div>
              </div>

              <div class="install__brief-main">
                <div class="install__brief-main-item">
                  <div class="install__brief-main-item-text">1. Tap on</div>
                  <div class="install__brief-main-item-info">
                    <img
                      class="install__brief-main-item-info-image"
                      src="./assets/icons/share_ios_export.svg"
                      alt="icon"
                    />
                  </div>
                </div>

                <figure class="install__brief-main-figure">
                  <img
                    class="install__brief-main-figure-image"
                    src="./assets/ios-screenshot.jpg"
                    alt="screenshot"
                  />
                </figure>

                <div class="install__brief-main-item">
                  <div class="install__brief-main-item-text">2. Then select</div>
                  <div class="install__brief-main-item-info">
                    <span class="install__brief-main-item-info-text">Add to Homescrean</span>
                    <img
                      class="install__brief-main-item-info-image"
                      src="./assets/icons/add_plus_square.svg"
                      alt="icon"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
